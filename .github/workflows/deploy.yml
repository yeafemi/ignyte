name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Check Secrets
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "::warning::VITE_SUPABASE_URL secret is missing! The site will not be able to fetch data."
          fi
          if [ -z "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" ] && [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::warning::VITE_SUPABASE_PUBLISHABLE_KEY secret is missing! The site will not be able to fetch data."
          fi

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://jukzcawfbdmnxdgiyhwk.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_ieWPAi4vwFBNYEdnjpv4NQ_BTayalXE' }}

      - name: Generate Static Entry Point
        run: |
          CDIR="dist/client"
          mkdir -p $CDIR

          # The largest index-*.js is the main app entry (vendor bundle)
          # The smaller one is the home page route chunk — we do NOT want that
          MAIN_JS=$(ls -S $CDIR/assets/index-*.js 2>/dev/null | head -n 1)
          MAIN_CSS=$(ls -S $CDIR/assets/styles-*.css 2>/dev/null | head -n 1)

          if [ -z "$MAIN_JS" ]; then
            echo "Error: Could not find main JS bundle in $CDIR/assets/"
            ls -R $CDIR/assets/
            exit 1
          fi

          JS_FILE=$(basename $MAIN_JS)
          CSS_FILE=$(basename $MAIN_CSS)
          echo "Entry JS: $JS_FILE  CSS: $CSS_FILE"

          cat <<EOF > $CDIR/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>IGNYTE — Igniting Brands. Driving Growth.</title>
            <link rel="stylesheet" href="/ignyte/assets/$CSS_FILE">
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="/ignyte/assets/$JS_FILE"></script>
          </body>
          </html>
          EOF

          # Copy to 404.html for SPA routing support
          cp $CDIR/index.html $CDIR/404.html

          # Ensure there is a .nojekyll file
          touch $CDIR/.nojekyll

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/client'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
