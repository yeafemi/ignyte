name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build SPA
        run: npx vite build --config vite.static.config.ts || true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://jukzcawfbdmnxdgiyhwk.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_ieWPAi4vwFBNYEdnjpv4NQ_BTayalXE' }}
          VITE_BASE_PATH: "/ignyte/"

      - name: Prepare static output
        run: |
          # Copy for SPA 404 fallback routing
          cp dist/static/index.html dist/static/404.html
          # Ensure .nojekyll so GitHub Pages doesn't process files
          touch dist/static/.nojekyll
          echo "Files in dist/static:"
          ls -la dist/static/

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/static'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
